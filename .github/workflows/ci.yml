name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: cd python && python -m pytest -q

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: elan installieren
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean-Beweise bauen
        # schwere Kernel-Rechnungen nacheinander bauen, damit der Speicher reicht
        run: cd lean && lake build Collatz.Sieve16 && lake build Collatz.VerifiedLarge && lake build
      - name: Axiome prüfen (kein sorry)
        run: |
          cd lean
          lake env lean AxiomCheck.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then echo "sorry gefunden!"; exit 1; fi

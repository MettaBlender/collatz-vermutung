name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: cd python && python -m pytest -q

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: elan installieren
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean-Build zwischenspeichern
        # Lake baut jedes Modul neu, dessen Quelltext oder Abhängigkeiten sich geändert haben;
        # unveränderte Module (z. B. die grossen Kernel-Rechnungen) werden aus dem Cache genommen.
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.*', 'lean/**/*.lean') }}
          restore-keys: lake-
      - name: Lean-Beweise bauen
        # schwere Kernel-Rechnungen nacheinander bauen, damit der Speicher reicht
        run: |
          set -e
          cd lean
          for m in Sieve16 VerifiedLarge Sieve20A Sieve20B Sieve20C Sieve20D \
                   VerifiedHugeA VerifiedHugeB VerifiedHugeC VerifiedHugeD \
                   VerifiedHugeE VerifiedHugeF VerifiedHugeG VerifiedHugeH; do
            lake build Collatz.$m
          done
          for f in Collatz/V24/F*.lean; do
            lake build Collatz.V24.$(basename "$f" .lean)
          done
          lake build
      - name: Axiome prüfen (kein sorry)
        run: |
          cd lean
          lake env lean AxiomCheck.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then echo "sorry gefunden!"; exit 1; fi
